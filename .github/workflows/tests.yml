name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # render.py und history.py brauchen nur die Standardbibliothek,
      # deshalb kein Install-Schritt.
      - name: Run tests
        run: python3 -m unittest discover -s scripts/test -t scripts/test -v
